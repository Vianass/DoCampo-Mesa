              schema:
                $ref: '#/components/schemas/CheckoutUncertain'
              example:
                codigo: RESULTADO_DESCONHECIDO
                mensagem: Não foi possível confirmar o resultado. Repete o mesmo pedido com a mesma chave.
                repetirComMesmaChave: true
