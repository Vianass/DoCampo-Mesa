        Inteiro positivo em g/ml/unidades/número de embalagens conforme T32-02; frações de kg/L convertem-se em g/ml. O contexto da unidade é obrigatório para interpretar o valor; embalagem não é o seu conteúdo. Tipo BSON, limites e DTO completo ainda por confirmar; não transportar valores que o cliente não represente exatamente.
      x-decision-dependencies:
        - Q03
      x-revision-required: true
      x-residual-model-decisions: [T32-02, T32-03]
