      operationId: createOrders
      summary: Criar uma compra transacional por produtor
      description:
        'Usa exclusivamente a identidade JWT atual e o serviço 4B.3. Conta ativa com capacidade comprador
        obrigatória inclusive no replay. Revalida capacidades produtoras e todas as condições comerciais na transação.
        Produtos inexistentes/indisponíveis, stock, preço, elegibilidade, taxas, agenda ou revisões incompatíveis
        dão 409 genérico sem detalhes administrativos privados. Uma falha aborta o grupo integral. O browser deve
        preservar chave e pedido em falhas de rede/503; só confirma sucesso após 200/201. 500 é reservado a falhas
        inesperadas, sem prova de sucesso: conservar a tentativa para recuperação. Métodos de pagamento apenas registados,
        sem processamento bancário.'
      parameters:
        - $ref: '#/components/parameters/CheckoutIdempotency'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrder'
            example:
              linhas:
                - produtoId: '222222222222222222222222'
                  produtorContaId: '111111111111111111111111'
                  quantidade: 500
                  ofertaAceite:
                    precoReferenciaCent: 150
                    unidadeVenda:
                      modalidade: peso
                      unidadeBase: g
                      quantidadeReferencia: 1000
                      quantidadeMinima: 250
                      incrementoCompra: 50
                    revisaoProdutoObservada: 0
              condicoesPorProdutor:
                - produtorContaId: '111111111111111111111111'
                  modalidade: levantamento
                  periodo:
                    inicioEm: '2026-11-02T09:00:00.000Z'
                    fimEm: '2026-11-02T10:00:00.000Z'
                    fusoHorario: Europe/Lisbon
                  metodoPagamento: dinheiro
                  taxaEntregaAceiteCent: 0
                  revisaoProdutorObservada: 0
      responses:
        '201':
          description: Nova compra integralmente confirmada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutGroup'
              example:
                operacaoCompraId: 12345678-1234-4234-8234-123456789abc
                criadaEm: '2026-11-01T08:00:00.000Z'
                encomendas:
                  - orderId: '333333333333333333333333'
                    produtorContaId: '111111111111111111111111'
                    estadoInicial: pendente
                    totalCent: 75
                totalCent: 75
                moeda: EUR
                origem: nova
          headers:
            Location:
              description: Detalhe da primeira encomenda do recibo; operacaoCompraId identifica a compra global.
              schema:
                type: string
        '200':
          description: Recibo original recuperado; não volta a debitar stock.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CheckoutGroup'
              example:
                operacaoCompraId: 12345678-1234-4234-8234-123456789abc
                criadaEm: '2026-11-01T08:00:00.000Z'
                encomendas:
                  - orderId: '333333333333333333333333'
                    produtorContaId: '111111111111111111111111'
                    estadoInicial: pendente
                    totalCent: 75
                totalCent: 75
                moeda: EUR
                origem: replay
          headers:
            Location:
              description: Detalhe da primeira encomenda do recibo; operacaoCompraId identifica a compra global.
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          description: CONFLITO_IDEMPOTENCIA, CONFLITO_REVISAO ou RECONFIRMACAO_NECESSARIA; sem criar uma compra parcial.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                codigo: RECONFIRMACAO_NECESSARIA
                mensagem: Consulta as condições atuais e confirma novamente a compra.
                campos:
                  - campo: pedido
                    mensagem:
                      As condições da compra deixaram de ser válidas. Consulta os dados atuais antes de confirmar
                      novamente.
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
        '415':
          description: Content-Type ou codificação não suportados.
