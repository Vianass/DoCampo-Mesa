components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        JWT com expiração exigido pelo enunciado; papéis/propriedade/aprovação são verificados no
        servidor, não pelo Swagger.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: ID do recurso; formato inválido 400, válido sem recurso elegível 404, proposta C02.
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Pesquisa escapada/limitada; semântica de ingrediente, acentos e normalização Q14/C03.
    Page:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Paginação proposta C03; valor por omissão por aprovar.
    PageSize:
      name: porPagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Dimensão/limite máximo por aprovar em C03; nunca aceitar resultado ilimitado por omissão.
    State:
      name: estado
      in: query
      schema:
        type: string
      description: Valores válidos dependem do enum do recurso; valor desconhecido gera 400, proposta C02.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description:
        Proposta D08, ainda não obrigatória. Após adoção, mesma chave/payload devolve o grupo persistido;
        payload diferente gera conflito. Não adotar sem aprovação.
  responses:
    Error400:
      description: Dados/parâmetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Token ausente, inválido ou expirado; no login, credenciais inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Papel, propriedade ou aprovação insuficientes; sem revelar dados privados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso inexistente ou fora do âmbito de consulta conforme política C02.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 'Proposta: conflito de versão, decisão já concluída, stock/preço ou chave idempotente.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Limite técnico de JSON de 100 KiB excedido, implementado na fundação 3.1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Erro interno sem detalhes sensíveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Código adicional ainda proposto, fora da aprovação explícita C02; dependência indisponível não representa lista vazia nem prova de rollback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TechnicalHealth:
      type: object
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [operacional]
        ambito:
          type: string
          enum: [processo-http]
      required: [estado, ambito]
    Id:
      type: string
      minLength: 1
      description:
        Identificador opaco de recurso da API; distinto dos slugs demonstrativos e das referências
        internas. C01 aprova estabilidade e independência dos nomes; formato concreto e geração ainda por detalhar.
    Timestamp:
      type: string
      format: date-time
      description: Instante UTC emitido pelo servidor; apresentação em Europe/Lisbon no frontend.
    Money:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description:
        'Proposta D05: unidade monetária mínima em inteiro seguro; moeda e aceitação de zero dependem
        de Q06.'
      x-decision-dependencies:
        - Q06
      x-proposal: D05
    Quantity:
      type: number
      minimum: 0
      exclusiveMinimum: true
      description:
        Quantidade positiva; Q03 decidirá se apenas inteiros comerciais ou representação escalada.
        Não autoriza compra fracionária por si.
      x-decision-dependencies:
        - Q03
    Role:
      type: string
      enum:
        - comprador
        - produtor
        - administrador
      description: Papéis académicos. Cardinalidade da conta depende de Q01; visitante não é conta.
    OrderStatus:
      type: string
      enum:
        - pendente
        - confirmada
        - pronta
        - entregue
      description: Estados exigidos; transições/cancelamento não decididos (Q05).
    AuctionStatus:
      type: string
      enum:
        - agendado
        - ativo
        - terminado
    Error:
      type: object
      properties:
        codigo:
          type: string
        mensagem:
          type: string
        requestId:
          type: string
        campos:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string
            required:
              - campo
              - mensagem
      required:
        - codigo
        - mensagem
      description:
        C02 aprova erros estruturados, códigos estáveis, mensagens claras e campos inválidos. Catálogo de códigos, requestId e limites ainda por confirmar. Nunca contém stack,
        hash, JWT ou URI privada.
    Image:
      type: object
      properties:
        url:
          type: string
        alt:
          type: string
      required:
        - url
        - alt
      description:
        Metadados públicos. Sem credenciais/SAS de escrita. Upload Blob não é implementado nesta
        subfase.
    Location:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - latitude
        - longitude
      description: Apenas localização autorizada para divulgação, dependente de Q11.
      additionalProperties: false
    SaleUnit:
      type: object
      properties:
        codigo:
          type: string
        rotulo:
          type: string
        tamanhoEmbalagem:
          type: string
      required:
        - codigo
        - rotulo
      description: Catálogo e escala dependem de Q03; rótulo não permite inferir fracionamento.
      additionalProperties: false
    UserSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        papel:
          $ref: '#/components/schemas/Role'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - nome
        - papel
      description: Projeção administrativa mínima; formato de papel único é a proposta Q01, não decisão final.
    UserSelf:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        email:
          type: string
          format: email
        papel:
          $ref: '#/components/schemas/Role'
      required:
        - id
        - nome
        - email
        - papel
    ProducerPublic:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nomePublico:
          type: string
        descricao:
          type: string
        localidade:
          type: string
        localizacao:
          $ref: '#/components/schemas/Location'
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
      required:
        - id
        - nomePublico
        - localidade
      description: ID de perfil produtor; não é users._id. Elegibilidade pública Q04/Q12; coordenadas Q11.
    Decision:
      type: object
      properties:
        autorId:
          $ref: '#/components/schemas/Id'
        decididoEm:
          $ref: '#/components/schemas/Timestamp'
        motivo:
          type: string
      required:
        - autorId
        - decididoEm
      description:
        Projeção administrativa; a projeção do próprio candidato deve reduzir a identidade administrativa
        se necessário. Persistência de evidência proposta D09.
    Application:
      type: object
      properties:
        produtorId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
            - pendente
            - aprovado
            - rejeitado
        submetidaEm:
          $ref: '#/components/schemas/Timestamp'
        decisao:
          $ref: '#/components/schemas/Decision'
      required:
        - produtorId
        - estado
        - submetidaEm
      description: Decisão ausente enquanto pendente. Permissões intermédias e recandidatura Q04.
    ProducerManaged:
      type: object
      properties:
        perfil:
          $ref: '#/components/schemas/ProducerPublic'
        userId:
          $ref: '#/components/schemas/Id'
        candidatura:
          $ref: '#/components/schemas/Application'
      required:
        - perfil
        - userId
        - candidatura
      description: Só o próprio produtor e administração autorizada; não reutilizar em resposta pública.
    Product:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        produtorId:
          $ref: '#/components/schemas/Id'
        nome: &id009
          type: string
        descricao: &id010
          type: string
        categoria: &id011
          type: string
        ingredientes: &id012
          type: array
          items:
            type: string
        epocaMeses: &id013
          type: array
          items:
            type: integer
            minimum: 1
            maximum: 12
        modoProducao: &id014
          type: string
        precoCent: &id015
          $ref: '#/components/schemas/Money'
        moeda:
          type: string
        unidadeVenda: &id016
          $ref: '#/components/schemas/SaleUnit'
        stockDisponivel: &id017
          type: number
          minimum: 0
        limiarStockBaixo: &id018
          type: number
          minimum: 0
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        versao:
          type: integer
          minimum: 0
      required:
        - id
        - produtorId
        - nome
        - precoCent
        - unidadeVenda
        - stockDisponivel
      description:
        DTO proposto. produtorId refere perfil público, resolvido a partir de products.produtor
        → users → producers.userId. Q03/Q06/Q14/Q15 condicionam escala/taxonomias.
    OrderLine:
      type: object
      properties:
        produtoId:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        precoUnitCent:
          $ref: '#/components/schemas/Money'
        quantidade:
          $ref: '#/components/schemas/Quantity'
        unidadeSnapshot:
          $ref: '#/components/schemas/SaleUnit'
        subtotalCent:
          $ref: '#/components/schemas/Money'
        imagemSnapshot:
          $ref: '#/components/schemas/Image'
      required:
        - produtoId
        - nome
        - precoUnitCent
        - quantidade
        - unidadeSnapshot
        - subtotalCent
      description: Snapshot imutável criado pelo servidor; imagem é proposta de adaptação, não obrigação académica.
    Delivery:
      type: object
      properties:
        tipo:
          type: string
          enum:
            - levantamento
            - entrega
        moradaSnapshot:
          type: string
        instrucoes:
          type: string
      required:
        - tipo
      additionalProperties: false
    OrderHistory:
      type: object
      properties:
        estado:
          $ref: '#/components/schemas/OrderStatus'
        ocorridoEm:
          $ref: '#/components/schemas/Timestamp'
      required:
        - estado
        - ocorridoEm
    Order:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        referencia:
          type: string
        compradorId:
          $ref: '#/components/schemas/Id'
        produtorId:
          $ref: '#/components/schemas/Id'
        linhas:
          type: array
          items:
            $ref: '#/components/schemas/OrderLine'
        subtotalCent:
          $ref: '#/components/schemas/Money'
        totalCent:
          $ref: '#/components/schemas/Money'
        moeda:
          type: string
        estado:
          $ref: '#/components/schemas/OrderStatus'
        entrega:
          $ref: '#/components/schemas/Delivery'
        historico:
          type: array
          items:
            $ref: '#/components/schemas/OrderHistory'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
        versao:
          type: integer
          minimum: 0
      required:
        - id
        - compradorId
        - produtorId
        - linhas
        - totalCent
        - estado
        - historico
      description:
        Proposta de uma encomenda por produtor (Q02). Morada só na projeção privada estritamente
        necessária; estados/histórico Q05. Não é DTO público.
    CheckoutGroup:
      type: object
      properties:
        checkoutId:
          type: string
        encomendas:
          type: array
          items:
            $ref: '#/components/schemas/Order'
      required:
        - checkoutId
        - encomendas
      description: Alternativa recomendada Q02; não adotada automaticamente.
    Review:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        alvoTipo:
          type: string
          enum:
            - produto
            - produtor
        alvoId:
          $ref: '#/components/schemas/Id'
        nomePublicoAutor:
          type: string
        classificacao:
          type: integer
        comentario:
          type: string
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - alvoTipo
        - alvoId
        - nomePublicoAutor
        - classificacao
        - createdAt
      description:
        Projeção pública sem email, compradorId, morada ou denúncias. Escala/cardinalidade Q10;
        ocultas excluídas segundo política Q12.
    Report:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        motivo:
          type: string
        denunciadaEm:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - motivo
        - denunciadaEm
      description: Projeção administrativa mínima; autor da denúncia existe internamente, não na projeção pública.
    ModerationCase:
      type: object
      properties:
        id:
          allOf:
            - $ref: '#/components/schemas/Id'
          description: 'Proposta C01: ID da review que agrupa denúncias, não coleção autónoma de casos.'
        avaliacao:
          $ref: '#/components/schemas/Review'
        denuncias:
          type: array
          items:
            $ref: '#/components/schemas/Report'
        estado:
          type: string
          enum:
            - pendente
            - mantida
            - oculta
        decisao:
          $ref: '#/components/schemas/Decision'
        encomendaId:
          $ref: '#/components/schemas/Id'
      required:
        - id
        - avaliacao
        - denuncias
        - estado
        - encomendaId
      description:
