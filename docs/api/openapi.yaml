components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        JWT com expiração exigido pelo enunciado; papéis/propriedade/aprovação são verificados no
        servidor, não pelo Swagger.
  parameters:
    AdminUserId8A:
      name: id
      in: path
      required: true
      description: ID estável da conta users._id; não é o ID do perfil produtor.
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
      description: ID MongoDB estável; perfil produtor não é users._id. Inválido 400, inexistente/não público 404.
    CatalogSearch:
      name: pesquisa
      in: query
      required: false
      schema:
        type: string
        minLength: 1
        maxLength: 100
      description:
        Texto literal, máximo 10 termos. Em products procura nome, descrição, produtor e localidade; em producers
        nome, descrição, localidade e concelho; em produtos próprios procura nome. Omitir valores vazios.
    CatalogPage:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
        default: 1
      description: Página pedida; além da última devolve itens vazios, preservando total e paginação pedida.
    CatalogPageSize:
      name: porPagina
      in: query
      required: false
      schema:
        type: integer
        enum:
          - 12
          - 24
          - 36
        default: 12
      description: Mesmas dimensões do catálogo React.
    CatalogOrder:
      name: ordem
      in: query
      required: false
      schema:
        type: string
        enum:
          - relevancia
          - preco-asc
          - preco-desc
          - nome-asc
          - nome-desc
          - recentes
        default: relevancia
      description:
        Desempate estável por ID; relevância privilegia nome exato/prefixo/conteúdo, sem campo fictício destaque.
        Produtos próprios usam nome para relevância.
    CatalogProducerOrder:
      name: ordem
      in: query
      required: false
      schema:
        type: string
        enum:
          - relevancia
          - nome-asc
          - nome-desc
          - recentes
        default: relevancia
      description: Ordenação dos perfis; sem preço de produtor.
    CatalogCategory:
      name: categoria
      in: query
      required: false
      schema:
        type: string
        enum:
          - cat-001
          - cat-002
          - cat-003
          - cat-004
          - cat-005
          - cat-006
          - cat-007
          - cat-008
          - cat-009
          - cat-010
          - cat-011
          - cat-012
      description: ID estável da categoria, não o rótulo demonstrativo.
    CatalogProducer:
      name: produtor
      in: query
      required: false
      schema:
        type: string
        pattern: ^[a-fA-F0-9]{24}$
      description: ID do perfil público produtor, nunca users._id ou slug demonstrativo.
    CatalogLocality:
      name: localidade
      in: query
      required: false
      schema:
        type: string
        maxLength: 120
      description: Correspondência exata sem distinção de maiúsculas/acentos portugueses.
    CatalogSeason:
      name: epoca
      in: query
      required: false
      schema:
        type: string
        enum:
          - Primavera
          - Verão
          - Outono
          - Inverno
      description:
        'Meses informativos: primavera 3–5, verão 6–8, outono 9–11, inverno 12/1/2. Não combinar com mes;
        ausência não significa todo o ano.'
    CatalogMonth:
      name: mes
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 12
      description: Filtra epocaMeses declarados; não controla compra/publicação.
    CatalogMode:
      name: modoProducao
      in: query
      required: false
      schema:
        type: string
        maxLength: 100
      description: Texto declarado pelo produtor, correspondência exata; sem enum de certificação.
    CatalogBio:
      name: bio
      in: query
      required: false
      schema:
        type: boolean
      description: true filtra modo declarado Biológico; false não aplica filtro. Não representa certificação verificada.
    CatalogMaxPrice:
      name: precoMax
      in: query
      required: false
      schema:
        type: string
        pattern: ^\d{1,5}(?:[.,]\d{1,2})?$
        example: 12,34
      description:
        Máximo em EUR, até 10000; conversão exata para cêntimos. Compara preços de referência, sem converter
        modalidades.
    CatalogOwnState:
      name: estado
      in: query
      required: false
      schema:
        type: string
        enum:
          - rascunho
          - publicado
          - arquivado
      description: Apenas nos produtos próprios.
    CatalogIfMatch:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        pattern: ^"[A-Za-z0-9_-]{43}"$
      description:
        ETag opaco atual recebido do endpoint próprio ou escrita. Não aceita wildcard, ETag fraco ou revisão
        escolhida. Ausente 428, formato inválido 400, desatualizado 412.
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: ID do recurso; formato inválido 400, válido sem recurso elegível 404, proposta C02.
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Pesquisa escapada/limitada; semântica de ingrediente, acentos e normalização Q14/C03.
    Page:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Paginação proposta C03; valor por omissão por aprovar.
    PageSize:
      name: porPagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Dimensão/limite máximo por aprovar em C03; nunca aceitar resultado ilimitado por omissão.
    State:
      name: estado
      in: query
      schema:
        type: string
      description: Valores válidos dependem do enum do recurso; valor desconhecido gera 400, proposta C02.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description:
        Proposta D08, ainda não obrigatória. Após adoção, mesma chave/payload devolve o grupo persistido;
        payload diferente gera conflito. Não adotar sem aprovação.
    CheckoutIdempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[!-~]{1,128}$
      description:
        Chave opaca global existente, ASCII visível, 1–128 caracteres. Uma por tentativa lógica; mesmo comprador/payload
        recupera o recibo. Reutilização diferente ou alheia dá conflito genérico. Headers duplicados são inválidos.
        O servidor não gera ou substitui a chave.
  responses:
    Error412:
      description: ETag desatualizado; consulta novamente o recurso antes de repetir.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error428:
      description: ETag atual obrigatório em If-Match nas operações condicionais.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error415:
      description: Content-Type/codificação não suportados; corpos comprimidos não são aceites.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error429:
      description: Limite de tentativas excedido; igual para contas existentes e inexistentes.
      headers:
        Retry-After:
          description: Segundos antes de repetir.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error400:
      description: Dados/parâmetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Token ausente, inválido ou expirado; no login, credenciais inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Papel, propriedade ou aprovação insuficientes; sem revelar dados privados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso inexistente ou fora do âmbito de consulta conforme política C02.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 'Proposta: conflito de versão, decisão já concluída, stock/preço ou chave idempotente.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Limite técnico de JSON de 100 KiB excedido, implementado na fundação 3.1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Erro interno sem detalhes sensíveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Código adicional ainda proposto, fora da aprovação explícita C02; dependência indisponível não representa lista vazia nem prova de rollback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
