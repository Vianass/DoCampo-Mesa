components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        JWT com expiração exigido pelo enunciado; papéis/propriedade/aprovação são verificados no
        servidor, não pelo Swagger.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: ID do recurso; formato inválido 400, válido sem recurso elegível 404, proposta C02.
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Pesquisa escapada/limitada; semântica de ingrediente, acentos e normalização Q14/C03.
    Page:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Paginação proposta C03; valor por omissão por aprovar.
    PageSize:
      name: porPagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Dimensão/limite máximo por aprovar em C03; nunca aceitar resultado ilimitado por omissão.
    State:
      name: estado
      in: query
      schema:
        type: string
      description: Valores válidos dependem do enum do recurso; valor desconhecido gera 400, proposta C02.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description:
        Proposta D08, ainda não obrigatória. Após adoção, mesma chave/payload devolve o grupo persistido;
        payload diferente gera conflito. Não adotar sem aprovação.
  responses:
    Error400:
      description: Dados/parâmetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Token ausente, inválido ou expirado; no login, credenciais inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Papel, propriedade ou aprovação insuficientes; sem revelar dados privados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso inexistente ou fora do âmbito de consulta conforme política C02.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 'Proposta: conflito de versão, decisão já concluída, stock/preço ou chave idempotente.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Limite técnico de JSON de 100 KiB excedido, implementado na fundação 3.1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Erro interno sem detalhes sensíveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Código adicional ainda proposto, fora da aprovação explícita C02; dependência indisponível não representa lista vazia nem prova de rollback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    TechnicalHealth:
      type: object
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [operacional]
        ambito:
          type: string
          enum: [processo-http]
      required: [estado, ambito]
    Id:
      type: string
      minLength: 1
      description:
        Identificador opaco de recurso da API; distinto dos slugs demonstrativos e das referências
        internas. C01 aprova estabilidade e independência dos nomes; formato concreto e geração ainda por detalhar.
    Timestamp:
      type: string
      format: date-time
      description: Instante UTC emitido pelo servidor; apresentação em Europe/Lisbon no frontend.
    Money:
      type: integer
      minimum: 0
      maximum: 9007199254740991
      description: >-
        EUR/cêntimos inteiros aprovados em Q06. Limites numéricos concretos são proposta técnica; zero e limites permanecem pendentes, sem aprovar produtos gratuitos. T32-03 aprova cálculo exato e half-up por linha; total soma linhas arredondadas.
      x-decision-dependencies:
        - Q06
      x-proposal: D05
      x-residual-model-decisions: [T32-03]
    Quantity:
      type: integer
      minimum: 0
      exclusiveMinimum: true
      description: >-
        Inteiro positivo em g/ml/unidades/número de embalagens conforme T32-02; frações de kg/L convertem-se em g/ml. O contexto da unidade é obrigatório para interpretar o valor; embalagem não é o seu conteúdo. Tipo BSON, limites e DTO completo ainda por confirmar; não transportar valores que o cliente não represente exatamente.
      x-decision-dependencies:
        - Q03
      x-revision-required: true
      x-residual-model-decisions: [T32-02, T32-03]
    Role:
      type: string
      enum:
        - comprador
        - produtor
        - administrador
      description: >-
        Capacidade académica individual; uma conta pode acumular comprador/produtor conforme Q01. Admin só por procedimento controlado; visitante não é conta; aprovação comercial é separada.
    ProductStatus:
      type: string
      enum: [rascunho, publicado, arquivado]
      description: >-
        T32-05 aprovado. Inicial rascunho; publicação explícita por produtor aprovado.
        Aprovação do perfil não publica. Publicado com stock zero pode ficar visível sem compra;
        esgotado é disponibilidade derivada. Arquivo retira da venda e preserva histórico.
    OrderStatus:
      type: string
      enum:
        - pendente
        - confirmada
        - pronta
        - entregue
      description: Estados exigidos; transições/cancelamento não decididos (Q05).
    AuctionStatus:
      type: string
      enum:
        - agendado
        - ativo
        - terminado
    Error:
      type: object
      properties:
        codigo:
          type: string
        mensagem:
          type: string
        requestId:
          type: string
        campos:
          type: array
          items:
            type: object
            properties:
              campo:
                type: string
              mensagem:
                type: string
            required:
              - campo
              - mensagem
      required:
        - codigo
        - mensagem
      description:
        C02 aprova erros estruturados, códigos estáveis, mensagens claras e campos inválidos. Catálogo de códigos, requestId e limites ainda por confirmar. Nunca contém stack,
        hash, JWT ou URI privada.
    Image:
      type: object
      properties:
        url:
          type: string
        alt:
          type: string
      required:
        - url
        - alt
      description:
        Metadados públicos. Sem credenciais/SAS de escrita. Upload Blob não é implementado nesta
        subfase.
    Location:
      type: object
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required:
        - latitude
        - longitude
      description: Apenas localização autorizada para divulgação, dependente de Q11.
      additionalProperties: false
    SaleUnit:
      type: object
      properties:
        modalidade:
          type: string
          enum: [unidade, embalagem, peso, volume]
        unidadeBase:
          type: string
          enum: [un, g, ml]
        quantidadeReferencia:
          $ref: '#/components/schemas/Quantity'
        quantidadeMinima:
          $ref: '#/components/schemas/Quantity'
        incrementoCompra:
          $ref: '#/components/schemas/Quantity'
        rotulo:
          type: string
        conteudoPorUnidade:
          type: object
          properties:
            quantidade:
              $ref: '#/components/schemas/Quantity'
            unidade:
              type: string
              enum: [un, g, ml]
          required: [quantidade, unidade]
          additionalProperties: false
      required: [modalidade, unidadeBase, quantidadeReferencia, rotulo]
      description: >-
        Forma candidata alinhada com phase-3.2-models.md, sem aprovação global dos campos/required.
        T32-02 aprova peso em g, volume em ml, unidade inteira e contagem de embalagens;
        embalagem usa unidade comercial un e conteúdo separado, sem venda fracionada implícita.
        O preço em cêntimos refere-se a quantidadeReferencia na unidadeBase; limites,
        mínimos/passos, validação das combinações e shape definitivo continuam pendentes.
      additionalProperties: false
      x-revision-required: true
      x-field-shape-status: proposta-aguarda-confirmacao
      x-residual-model-decisions: [T32-02]
    UserSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        papeis:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
        createdAt:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - nome
        - papeis
      description: >-
        Projeção própria ou administrativa mínima conforme o recurso. Q01/T32-01 aprovam lista de papéis e acumulação comprador/produtor; não há aprovação automática de venda ou combinação administrativa. Nunca inclui hash.
      x-residual-model-decisions: [T32-01]
    UserSelf:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nome:
          type: string
        email:
          type: string
          format: email
        papeis:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/Role'
      required:
        - id
        - nome
        - email
        - papeis
      description: >-
        Projeção própria ou administrativa mínima conforme o recurso. Q01/T32-01 aprovam lista de papéis e acumulação comprador/produtor; não há aprovação automática de venda ou combinação administrativa. Nunca inclui hash.
      x-residual-model-decisions: [T32-01]
    ProducerPublic:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        nomePublico:
          type: string
        descricao:
          type: string
        localidade:
          type: string
        localizacao:
          $ref: '#/components/schemas/Location'
        imagens:
          type: array
          items:
            $ref: '#/components/schemas/Image'
      required:
        - id
        - nomePublico
        - localidade
      description: ID de perfil produtor; não é users._id. Elegibilidade pública Q04/Q12; coordenadas Q11.
    Decision:
      type: object
      properties:
        autorId:
          $ref: '#/components/schemas/Id'
        decididoEm:
          $ref: '#/components/schemas/Timestamp'
        motivo:
          type: string
      required:
        - autorId
        - decididoEm
      description:
        Projeção administrativa; a projeção do próprio candidato deve reduzir a identidade administrativa
        se necessário. Persistência de evidência proposta D09.
    Application:
      type: object
      properties:
        produtorId:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
            - pendente
            - aprovado
            - rejeitado
        submetidaEm:
          $ref: '#/components/schemas/Timestamp'
        decisao:
          $ref: '#/components/schemas/Decision'
      required:
        - produtorId
        - estado
