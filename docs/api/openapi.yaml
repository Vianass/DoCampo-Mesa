        produtorContaId:
          type: string
          pattern: ^[a-fA-F0-9]{24}$
        estado:
          $ref: '#/components/schemas/OrderStatus'
        linhas:
          type: array
          items:
            $ref: '#/components/schemas/BuyerOrderLine'
          minItems: 1
        subtotalProdutosCent:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        taxaEntregaCent:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        totalCent:
          type: integer
          minimum: 1
          maximum: 9007199254740991
        moeda:
          type: string
          enum:
            - EUR
        pagamento:
          type: object
          additionalProperties: false
          properties:
            metodo:
              type: string
              enum:
                - dinheiro
                - mb_way
                - transferencia_bancaria
            estado:
              type: string
              enum:
                - por_pagar
                - pagamento_comunicado
                - pago
          required:
            - metodo
            - estado
        criadaEm:
          type: string
          format: date-time
        atualizadaEm:
          type: string
          format: date-time
        entrega:
          type: object
          additionalProperties: false
          properties:
            modalidade:
              type: string
              enum:
                - levantamento
                - entrega
            periodoInicial:
              $ref: '#/components/schemas/CheckoutPeriod'
            taxaEntregaCent:
              type: integer
              minimum: 0
              maximum: 9007199254740991
            localLevantamento:
              type: string
            concelhoId:
              type: string
            morada:
              type: string
            contacto:
              type: string
          required:
            - modalidade
            - periodoInicial
            - taxaEntregaCent
          oneOf:
            - properties:
                modalidade:
                  type: string
                  enum:
                    - levantamento
              required:
                - localLevantamento
            - properties:
                modalidade:
                  type: string
                  enum:
                    - entrega
              required:
                - concelhoId
                - morada
                - contacto
        historicoEstado:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              tipo:
                type: string
              de:
                $ref: '#/components/schemas/OrderStatus'
              para:
                $ref: '#/components/schemas/OrderStatus'
              ocorridoEm:
                type: string
                format: date-time
            required:
              - tipo
              - ocorridoEm
        produtor:
          type: object
          additionalProperties: false
          properties:
            perfilId:
              type: string
              pattern: ^[a-fA-F0-9]{24}$
            nomePublico:
              type: string
          required:
            - perfilId
            - nomePublico
        versao:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        podeConfirmarRececao:
          type: boolean
          description: Verdadeiro apenas em pronta; autorização continua no backend.
        rececao:
          type: object
          additionalProperties: false
          required:
            - confirmadaEm
            - concluidaEm
          properties:
            confirmadaEm:
              type: string
              format: date-time
              nullable: true
            concluidaEm:
              type: string
              format: date-time
              nullable: true
        origem:
          type: string
          enum:
            - nova
            - recuperada
      required:
        - id
        - operacaoCompraId
        - produtorContaId
        - estado
        - linhas
        - subtotalProdutosCent
        - taxaEntregaCent
        - totalCent
        - moeda
        - pagamento
        - criadaEm
        - atualizadaEm
        - entrega
        - historicoEstado
        - origem
        - versao
        - podeConfirmarRececao
        - rececao
      description:
        'Detalhe autorizado: inclui snapshot de levantamento ou morada/contacto da própria encomenda,
        período inicial e histórico minimizado; nunca reconsulta preços atuais ou expõe atores/auditoria privada.
        A propriedade opcional produtor identifica o perfil público atual; não é um snapshot histórico do
        seu nome. Valores/linhas/entrega continuam snapshots.'
