components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description:
        JWT com expiração exigido pelo enunciado; papéis/propriedade/aprovação são verificados no
        servidor, não pelo Swagger.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Id'
      description: ID do recurso; formato inválido 400, válido sem recurso elegível 404, proposta C02.
    Q:
      name: q
      in: query
      schema:
        type: string
      description: Pesquisa escapada/limitada; semântica de ingrediente, acentos e normalização Q14/C03.
    Page:
      name: pagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Paginação proposta C03; valor por omissão por aprovar.
    PageSize:
      name: porPagina
      in: query
      schema:
        type: integer
        minimum: 1
      description: Dimensão/limite máximo por aprovar em C03; nunca aceitar resultado ilimitado por omissão.
    State:
      name: estado
      in: query
      schema:
        type: string
      description: Valores válidos dependem do enum do recurso; valor desconhecido gera 400, proposta C02.
    Idempotency:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
      description:
        Proposta D08, ainda não obrigatória. Após adoção, mesma chave/payload devolve o grupo persistido;
        payload diferente gera conflito. Não adotar sem aprovação.
  responses:
    Error400:
      description: Dados/parâmetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error401:
      description: Token ausente, inválido ou expirado; no login, credenciais inválidas.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error403:
      description: Papel, propriedade ou aprovação insuficientes; sem revelar dados privados.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error404:
      description: Recurso inexistente ou fora do âmbito de consulta conforme política C02.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error409:
      description: 'Proposta: conflito de versão, decisão já concluída, stock/preço ou chave idempotente.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error413:
      description: Limite técnico de JSON de 100 KiB excedido, implementado na fundação 3.1.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error500:
      description: Erro interno sem detalhes sensíveis.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Error503:
      description: Código adicional ainda proposto, fora da aprovação explícita C02; dependência indisponível não representa lista vazia nem prova de rollback.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    OrderConditionSelection:
      type: object
      properties:
        produtorId:
          $ref: '#/components/schemas/Id'
        modalidade:
          type: string
          enum:
            - levantamento
            - entrega
        concelhoId:
          $ref: '#/components/schemas/Id'
        morada:
          type: string
          minLength: 1
          maxLength: 500
        periodo:
          $ref: '#/components/schemas/OrderPeriod'
        metodoPagamento:
          type: string
          enum:
            - dinheiro
            - mb_way
            - transferencia_bancaria
        taxaEntregaAceiteCent:
          $ref: '#/components/schemas/OrderMoney'
        versaoConfiguracaoAceite:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
        - produtorId
        - modalidade
        - periodo
        - metodoPagamento
        - taxaEntregaAceiteCent
        - versaoConfiguracaoAceite
      additionalProperties: false
      description:
        Seleção por produtor; ID público de perfil é resolvido a userId do owner real dos produtos, não atribuído
        pelo browser. Morada/concelho obrigatórios no domicílio; levantamento exige taxa zero. Servidor revalida agenda,
        zona, método, tarifa e aprovação.
      oneOf:
        - properties:
            modalidade:
              enum:
                - entrega
          required:
            - morada
            - concelhoId
        - properties:
            modalidade:
              enum:
                - levantamento
            taxaEntregaAceiteCent:
              enum:
                - 0
    OrderLineInput:
      type: object
      properties:
        produtoId:
          $ref: '#/components/schemas/Id'
        quantidade:
          type: integer
          minimum: 1
          maximum: 10000000
        ofertaAceite:
          type: object
          properties:
            precoReferenciaCent:
              $ref: '#/components/schemas/ProductPrice'
            unidadeSnapshot:
              $ref: '#/components/schemas/ProductSaleUnit'
          required:
            - precoReferenciaCent
            - unidadeSnapshot
          additionalProperties: false
      required:
        - produtoId
        - quantidade
        - ofertaAceite
      additionalProperties: false
      description:
        Oferta aceite é expectativa do comprador, não autoridade de preço. Agregar por produtoId; aceitação
        contraditória em duplicados exige reconfirmação. Servidor valida condições atuais na transação.
    CheckoutReceiptItem:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        produtorId:
          $ref: '#/components/schemas/Id'
        estadoInicial:
          type: string
          enum:
            - pendente
        totalCent:
          $ref: '#/components/schemas/OrderPositiveMoney'
      required:
        - id
        - produtorId
        - estadoInicial
        - totalCent
      additionalProperties: false
      description: Item do recibo original imutável; estadoInicial não pretende representar estado atual da order.
    OrderComplaintSummary:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        estado:
          type: string
          enum:
            - aberta
            - em_analise
            - escalada
            - resolvida
        criadaEm:
          $ref: '#/components/schemas/Timestamp'
      required:
        - id
        - estado
        - criadaEm
      additionalProperties: false
      description:
        Resumo minimizado; descrição/intervenções detalhadas só em projeção privada apropriada, sem expor
        dados no DTO administrativo de lista.
    OrderComplaint:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/Id'
        motivo:
          type: string
          minLength: 1
          maxLength: 500
        descricao:
          type: string
          minLength: 1
          maxLength: 4000
        estado:
          type: string
          enum:
            - aberta
            - em_analise
            - escalada
            - resolvida
        criadaEm:
          $ref: '#/components/schemas/Timestamp'
        historico:
          type: array
          items:
            $ref: '#/components/schemas/OrderAuditEvent'
          minItems: 1
        solucaoProposta:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - id
        - motivo
        - descricao
        - estado
        - criadaEm
        - historico
      additionalProperties: false
      description:
        Projeção de detalhe privado futuro; várias reclamações simultâneas e independentes. Somente comprador
        aceita solução ou admin resolve fundamentadamente; produtor não encerra. Sem unicidade por motivo/descrição,
        sem limite funcional de uma ativa. Auditoria limitada por bytes/reserva e nunca truncada.
      x-contract-status: proposta-bloqueada
    OrderReception:
      type: object
      properties:
        duracaoMs:
          type: integer
          enum:
            - 604800000
        decorridoMs:
          type: integer
          minimum: 0
          maximum: 604800000
        entregaDeclaradaEm:
          $ref: '#/components/schemas/Timestamp'
        confirmacaoRececaoEm:
          $ref: '#/components/schemas/Timestamp'
        ultimoInicioEm:
          type: string
          format: date-time
          nullable: true
        pausadoDesde:
          type: string
          format: date-time
          nullable: true
        limiteAtualEm:
          type: string
          format: date-time
          nullable: true
        concluidaEm:
          $ref: '#/components/schemas/Timestamp'
        modoConclusao:
          type: string
          enum:
            - comprador
            - automatica
            - intervencao_administrativa
        motivoConclusao:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - duracaoMs
        - decorridoMs
        - ultimoInicioEm
        - pausadoDesde
        - limiteAtualEm
      additionalProperties: false
      description:
        'OR09: 168 horas ativas desde entrega declarada; todas as reclamações não resolvidas pausam uma só
        contagem. Última resolução retoma tempo restante; job idempotente não altera pagamento. Campos de conclusão
        só quando efetiva.'
    OrderFulfilmentPrivate:
      type: object
      properties:
        orderId:
          $ref: '#/components/schemas/Id'
        morada:
          type: string
          minLength: 1
          maxLength: 500
        concelhoId:
          $ref: '#/components/schemas/Id'
        localLevantamento:
          type: string
