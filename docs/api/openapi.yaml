paths:
  /health:
    get:
      operationId: getHealth
      tags: [Diagnóstico técnico]
      summary: Verificar resposta do processo HTTP
      description: >-
        Implementado apenas localmente na Fase 3.1. Não verifica disponibilidade atual
        de MongoDB ou serviços Cloud. Sem parâmetros de consulta; autenticação não necessária.
      security: []
      x-authorized-roles: [visitante, comprador, produtor, administrador]
      x-decision-dependencies: []
      x-contract-status: implementado-localmente
      x-implementation-stage: '3.1'
      responses:
        '200':
          description: O processo HTTP respondeu; não representa prontidão das dependências.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechnicalHealth'
        '400':
          $ref: '#/components/responses/Error400'
        '413':
          $ref: '#/components/responses/Error413'
        '500':
          $ref: '#/components/responses/Error500'
  /auth/register:
    post:
      operationId: register
      tags: [Autenticação]
      summary: Registar exclusivamente uma conta compradora
      description: >-
        Normaliza email, protege password com Argon2id e força capacidade comprador.
        Email duplicado recebe a mesma resposta 202, sem substituir a conta existente.
        Não emite token no registo nem atribui produtor ou administrador. Sem confirmação de password neste contrato.
      security: []
      x-authorized-roles: [visitante, comprador, produtor, administrador]
      x-contract-status: implementado-localmente
      x-implementation-stage: '4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Registration'
            example:
              nome: Pessoa fictícia
              email: pessoa@example.invalid
              password: Frase fictícia apenas para exemplo!
      responses:
        '202':
          description: Resposta genérica, igual para email novo e duplicado; sem revelar a existência da conta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationAcknowledgement'
              example:
                mensagem: Pedido de registo recebido. Tenta iniciar sessão com os dados indicados.
        '400':
          $ref: '#/components/responses/Error400'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /auth/login:
    post:
      operationId: login
      tags: [Autenticação]
      summary: Autenticar e emitir JWT HS256 com expiração
      description: >-
        Verifica Argon2id ou bcrypt legado; conta inexistente, desativada e password
        incorreta devolvem o mesmo erro 401. JWT contém apenas sub/iss/aud/iat/exp/jti,
        nunca papéis ou dados pessoais. Duração por omissão 900 segundos, configurável entre 60 e 3600.
      security: []
      x-authorized-roles: [visitante, comprador, produtor, administrador]
      x-contract-status: implementado-localmente
      x-implementation-stage: '4'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credentials'
            example:
              email: pessoa@example.invalid
              password: Frase fictícia apenas para exemplo!
      responses:
        '200':
          description: Token e projeção própria mínima; Cache-Control no-store. Sem token real nos exemplos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessToken'
              example:
                accessToken: JWT_FICTICIO_NAO_UTILIZAVEL
                tokenType: Bearer
                expiresAt: '2026-10-26T12:15:00.000Z'
                utilizador:
                  id: '000000000000000000000011'
                  nome: Pessoa fictícia
                  email: pessoa@example.invalid
                  papeis: [comprador]
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '413':
          $ref: '#/components/responses/Error413'
        '415':
          $ref: '#/components/responses/Error415'
        '429':
          $ref: '#/components/responses/Error429'
        '500':
          $ref: '#/components/responses/Error500'
  /auth/me:
    get:
      operationId: getMe
      tags: [Autenticação]
      summary: Consultar apenas a identidade autenticada
      description: JWT Bearer verificado e conta ativa consultada em cada pedido; papéis atuais da base de dados, sem hash ou revisão.
      security:
        - bearerAuth: []
      x-authorized-roles: &id007 [comprador, produtor, administrador]
      x-contract-status: implementado-localmente
      x-implementation-stage: '4'
      responses:
        '200':
          description: Projeção da própria conta, sem dados de outros utilizadores; Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSelf'
              example:
                id: '000000000000000000000011'
                nome: Pessoa fictícia
                email: pessoa@example.invalid
                papeis: [comprador]
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
  /auth/logout:
    post:
      operationId: logout
      tags: [Autenticação]
      summary: Declarar o encerramento local sem revogação do JWT
      description: >-
        Exige Bearer válido. O cliente deve descartar o token; o servidor NÃO o revoga.
        O token continua válido até expirar, sujeito à verificação atual da conta.
        Não há refresh token, cookie de sessão ou denylist nesta fase.
      security:
        - bearerAuth: []
      x-authorized-roles: [comprador, produtor, administrador]
      x-contract-status: implementado-localmente
      x-implementation-stage: '4'
      responses:
        '200':
          description: Informação explícita sobre a ausência de revogação; Cache-Control no-store.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResult'
              example:
                mensagem: Termina a sessão no cliente. O token continua válido até expirar.
                revogado: false
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '500':
          $ref: '#/components/responses/Error500'
